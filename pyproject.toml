[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-trading-scanner"
version = "0.1.0"
description = "Offline foundation for the AI Trading Scanner research project"
readme = "README.md"
requires-python = "==3.13.15"
dependencies = [
  "exchange-calendars==4.13.2",
  "fastapi==0.116.1",
  "pydantic==2.11.7",
]

[project.scripts]
ai-trading-scanner = "ai_trading_scanner.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trading_scanner"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
